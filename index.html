<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix image">
      <a class="link-more" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="section-add-task">
        <h2 class="section-header header-add-task" for="input-new-task">Add Item</h2>
        <div class="task-row-wrapper">
          <input id="input-new-task"class="input input-text input-task" type="text">
          <button class="button">Add</button>
        </div>
      </section>
      <section id="section-todo" class="section">
        <h2 class="section-header">Todo</h2>
        <div class="task-container">
          <input type="checkbox" class="input input-checkbox">
          <label class="label input-task">Pay Bills</label>
          <input type="text" class="input input-text input-task">
          <button class="button button-edit">Edit</button>
          <button class="button button-delete">
            <img class="button-img" alt="Remove icon" src="./remove.svg">
          </button>
        </div>
        <div class="task-container task-container-edit">
          <input type="checkbox" class="input input-checkbox">
          <label class="label input-task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="input input-text input-task">
          <button class="button button-edit">Save</button>
          <button class="button button-delete">
            <img class="button-img" alt="Remove icon" src="./remove.svg">
          </button>
        </div>
      </section>
      <section id="section-completed-tasks" class="section">
        <h2 class="section-header">Completed</h2>
        <div class="task-container">
          <input type="checkbox" class="input input-checkbox" checked>
          <label class="label input-task">See the Doctor</label>
          <input type="text" class="input input-text input-task">
          <button class="button button-edit">Edit</button>
          <button class="button button-delete">
            <img class="button-img" alt="Remove icon" src="./remove.svg">
          </button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
