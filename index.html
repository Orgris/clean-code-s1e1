<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix image">
      <a class="header__link-more" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="section-add-task">
        <h2 class="section__header section__header--add-task" for="input-new-task">Add Item</h2>
        <div class="section__row-wrapper">
          <input id="input-new-task" class="section__input section__input--text section__input--task" type="text">
          <button class="section__button">Add</button>
        </div>
      </section>
      <section id="section-todo" class="section">
        <h2 class="section__header">Todo</h2>
        <div class="section__task-container">
          <input type="checkbox" class="section__input section__input--checkbox">
          <label class="section__label section__input--task">Pay Bills</label>
          <input type="text" class="section__input section__input--text section__input--task">
          <button class="section__button section__button--edit">Edit</button>
          <button class="section__button section__button--delete">
            <img class="section__button-img" alt="Remove icon" src="./remove.svg">
          </button>
        </div>
        <div class="section__task-container section__task-container--edit">
          <input type="checkbox" class="section__input section__input--checkbox">
          <label class="section__label section__input--task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="section__input section__input--text section__input--task">
          <button class="section__button section__button--edit">Save</button>
          <button class="section__button section__button--delete">
            <img class="section__button-img" alt="Remove icon" src="./remove.svg">
          </button>
        </div>
      </section>
      <section id="section-completed-tasks" class="section">
        <h2 class="section__header">Completed</h2>
        <div class="section__task-container">
          <input type="checkbox" class="section__input section__input--checkbox" checked>
          <label class="section__label section__input--task">See the Doctor</label>
          <input type="text" class="section__input section__input--text section__input--task">
          <button class="section__button section__button--edit">Edit</button>
          <button class="section__button section__button--delete">
            <img class="section__button-img" alt="Remove icon" src="./remove.svg">
          </button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
