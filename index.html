<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="header">
      <img src="./eisenhower-matrix.jpg">
      <a class="link-more" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main">
      <p id="section-add-task">
        <label for="input-new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="input-new-task"class="input-task" type="text">
          <button>Add</button>
        </div>
      </p>
      <h3>Todo</h3>
      <ul id="section-todo">
        <li>
          <input type="checkbox">
          <label class="input-task">Pay Bills</label>
          <input type="text" class="input-task">
          <button class="button-edit">Edit</button>
          <button class="button-delete">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="task-container-edit">
          <input type="checkbox">
          <label class="input-task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="input-task">
          <button class="button-edit">Save</button>
          <button class="button-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="section-completed-tasks">
        <li>
          <input type="checkbox" checked>
          <label class="input-task">See the Doctor</label>
          <input type="text" class="input-task">
          <button class="button-edit">Edit</button>
          <button class="button-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
